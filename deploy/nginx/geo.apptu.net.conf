# geo.apptu.net -> wpp-bot (127.0.0.1:3010)
server {
    listen 80;
    listen [::]:80;
    server_name geo.apptu.net;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name geo.apptu.net;
    ssl_certificate /etc/letsencrypt/live/geo.apptu.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geo.apptu.net/privkey.pem;
    client_max_body_size 5M;
    # Solo la página de placas/personas y su API; el resto del bot no se expone aqui
    location = / {
        proxy_pass http://127.0.0.1:3010/geo.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/alert-vehicles {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /api/geo-auth {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /favicon.ico { return 204; }
    location / { return 404; }
}
